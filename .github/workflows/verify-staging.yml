name: Verify IRCBM staging changes
on:
  push:
    branches: [ircbm-secure-backend-review]
  pull_request:
    branches: [main]
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install dependencies
        run: npm install --no-audit --no-fund
      - name: TypeScript check
        run: npm run lint
      - name: Production build
        run: npm run build
      - name: Secure migration package gate
        shell: bash
        run: |
          set -euo pipefail
          test -f functions/index.js
          test -f functions/programme_verified_58.json
          test -f firebase.json
          test -f firestore.rules
          test -f src/secure/SecureAdmin.tsx
          test -f src/secure/VolunteerScanner.tsx
          node --check functions/index.js
          (cd functions && npm install --no-audit --no-fund && npm run check)
          node --input-type=module <<'EOF'
          import { readFileSync } from 'node:fs';
          const papers=JSON.parse(readFileSync('functions/programme_verified_58.json','utf8'));
          if (papers.length !== 58) throw new Error('Expected exactly 58 programme papers');
          if (new Set(papers.map(p=>p.id)).size !== 58) throw new Error('Duplicate paper IDs');
          if (papers.some(p=>/tariq rahman|nadia farooq/i.test(JSON.stringify(p)))) throw new Error('Demo presentation found in approved programme');
          console.log('All 58 approved programme papers verified');
          EOF
